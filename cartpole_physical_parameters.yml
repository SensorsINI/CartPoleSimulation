cartpole:
  next_step_mode: 'Euler'  # 'Euler' or 'NeuralModel'
  next_step_neural_model_path: 'SI_Toolkit_ASF/Experiments/Experiment_3_04_2025_derivative/Models/Dense-6IN-128H1-128H2-3OUT-0'  # Path to the neural model, if next_step_mode is 'NeuralModel
  second_derivatives_mode: 'ODE'  # ODE or NeuralModel or ODE_with_NeuralModel_correction
  second_derivatives_neural_model_path: 'SI_Toolkit_ASF/Experiments/CPP_MPCswingups_before_23_04_2025/Models/Dense-6IN-128H1-128H2-2OUT-5'
  seed:  # This is a seed for rng for CartPole instance class only. If null random seed based on datetime is used
  PATH_TO_EXPERIMENT_RECORDINGS_DEFAULT: './Experiment_Recordings/'   # Where to save experiment recording per default
  # NOTE: m_cart/u_max/M_fric below are REVERTED to the working hand-tuned set so RPGD runs
  # on hardware. The honest system-ID story (and why those values broke RPGD) is recorded in
  # Driver/DataAnalysis/MotorAndCartFriction/motor_force_identification_2026-06/README.md.
  # HONEST, decorrelated system-ID values (no fudge factors).
  #  * m_cart = 2.82 kg: effective translational mass (cart body + reflected motor rotor
  #    inertia through the 19:1 gearbox and ~16 mm pulley); see
  #    Driver/DataAnalysis/MotorAndCartFriction/README.md (estimate_effective_mass.py).
  #  * u_max = 13 N: force gain at Q=1 from the decorrelated EMF power sweep
  #    (estimate_emf.py on a bare-cart, no-pole emf_identification run). The ordinary
  #    step response held Q constant while v ramped, so Q and v were collinear (corr
  #    ~0.76) and its joint fit OVER-stated u_max to 25.8 N; the decorrelated shuttle
  #    (corr ~0.40) recovers the true ~13 N.
  #  * M_fric / v_max: reconciled with the step-response TERMINAL (saturation) velocity,
  #    which is the cleanest measurement of the damping ratio -- the cart provably
  #    reaches steady state at every Q (end-of-step accel ~0), giving k/M_fric =
  #    9.42e-5 (m/s per PWM count), perfectly linear up to the safe PWM limit. Combined
  #    with u_max=13 this gives M_fric ~22 N/(m/s) and terminal speed at Q=1 ~0.59 m/s.
  #    (The EMF shuttle alone under-constrained M_fric at ~16 because it never dwelled
  #    at steady high speed; the terminal-velocity ratio fixes it.)
  m_cart: 0.230  # WORKING hand-tuned value (only set confirmed to swing up on hardware); honest effective mass ~2.82 kg, see Driver/DataAnalysis/MotorAndCartFriction/motor_force_identification_2026-06/README.md
  u_max: 1.77  # WORKING hand-tuned value; honest ID points to ~21.5 N (pulse), see motor_force_identification_2026-06/README.md
  M_fric: 3.22  # WORKING hand-tuned value; honest ID points to ~36 N/(m/s) (pulse), see motor_force_identification_2026-06/README.md
  J_fric: 5.0e-5  # friction coefficient on angular velocity in pole joint, Nm/rad/s # Checked by Marcin
  v_max: 0.59  # terminal speed at Q=1 = u_max/M_fric, from step-response saturation velocity # TODO: not implemented in model, but needed for MPC
  cart_length: 4.4e-2  # m, checked by Marcin&Asude
  track_length: 44.0e-2  # m, checked by Marcin&Asude, Total track length, usable track length is track_length-cart_length
  controlNoise_mode: 'gaussian'  # 'truncnorm' (with mu=Q+controlNoiseBias and scale controlNoiseScale, trunc -1,1), 'gaussian' (old, Q+controlNoiseScale*std_normal+controlNoiseBias), 'OFF'
  controlNoiseScale: 0.0  # disturbance, as factor of u_max # I used 0.2-0.5 for data collection
  controlNoiseCorrelation: 0.0 #
  controlNoiseBias: 0.0  # bias of control input
  g: 9.81  # absolute value of gravity acceleration, m/s^2
  k: "1.0/3.0"  # Dimensionless factor of moment of inertia of the pole with length 2L: I: (1/3)*m*(L)^2 = (4/3)*m*(L/2)^2
  latency: 0.0 # s
  noise:
    noise_mode: 'OFF'
    sigma_angle: 0.0  # As measured by Asude
    sigma_position: 0.0005
    sigma_angleD: 0.075 # This is much smaller than would result from sigma_angle under assumption of iir filter+derviative calculation; the theoretical value would be 2.28
    sigma_positionD: 0.005
  vertical_angle_offset:
    init_value: 0.0  # deg, number or 'random'
    change_every_x_seconds: 3.0 # If left empty angle shift changed at each simulation step, otherwise time in seconds, or 'inf' for no change
    mode: 'constant'  # 'constant', 'random_walk', 'increase', 'random', 'random_gaussian'
    range_random: [-3.141592, 3.141592]  # Range from which to uniformly sample, in radians
    range_clip:   # range at which to clip, leave empty for no clipping
    increment: 0.05  # increment in radians for random_walk and increase, std of gaussian for random_gaussian
    reset_every_x_seconds: 'inf'  # seconds, or 'inf' for no change
  L:
    init_value: 0.395  # length of pend, m
    change_every_x_seconds: # If left empty angle shift changed at each simulation step, otherwise time in seconds, or 'inf' for no change
    mode: 'constant'  # 'constant', 'random_walk', 'increase', 'random'
    range_random: [0.2, 0.5]  # Range from which to uniformly sample or at which to clip, leave empty for no clipping
    range_clip: [0.2, 0.5]  # range at which to clip, leave empty for no clipping
    increment: 0.00002
    reset_every_x_seconds: 'inf'  # seconds, or 'inf' for no change
  m_pole:
    init_value: 0.087      # length of pend, m
    change_every_x_seconds: 2 # If left empty angle shift changed at each simulation step, otherwise time in seconds, or 'inf' for no change
    mode: 'constant'  # 'constant', 'random_walk', 'increase', 'random'
    range_random: [ 0.015, 0.15]  # Range from which to uniformly sample or at which to clip, leave empty for no clipping
    range_clip: [ 0.015, 0.15 ]  # range at which to clip, leave empty for no clipping
    increment: 0.002
    reset_every_x_seconds: 'inf'  # seconds, or 'inf' for no change

  inform_controller_about_parameters_change:
    mode: 'ON'  # 'OFF', 'ON', 'switching_random', 'switching_regular'
    change_to_on_after_x_seconds_off: 1.5  # seconds, if mode switching_random this is the upper bound
    change_to_off_after_x_seconds_on: 4  # seconds, if mode switching_random this is the upper bound
  num_control_inputs: 1

cartpole_predictor:
  second_derivatives_mode: 'ODE'  # ODE or NeuralModel
  second_derivatives_neural_model_path: 'SI_Toolkit_ASF/Experiments/CPP_MPCswingups_before_23_04_2025/Models/Dense-6IN-128H1-128H2-2OUT-0'
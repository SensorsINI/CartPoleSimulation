# SecLoc gate profile, used by the PC secloc wrapper and pushed to the chip
# (CMD_SET_SECLOC_CONFIG) when the driver is connected. Edit and save to
# reload on the rig during operation; keep the values in sync with the
# standalone-chip defaults in Firmware/Src/General/secloc_defaults.h.
default:
  log_base: 1.05
  ref_period_ticks: 4  # in control loop iterations (POLLING_PERIOD_MS each); 4 x 5 ms = 20 ms apply window of mpc / neural-imitator. 0 or 1 = gate checked every iteration.
  dead_ang: 0.001      # dead bands suppress gate noise near equilibrium
  dead_pos: 0.001
  poll_stats_window_s: 5.0

# Phase 1 hardware matrix: run A/B/C with log_base 1.00 / 1.05 / 1.10 (edit, save, reload on rig).
default:
  log_base: 1.05
  ref_period: 0.0
  dead_ang: 0.0
  dead_pos: 0.0
  poll_stats_window_s: 5.0

# mpc / neural-imitator on physical cartpole: ref_period matches 20 ms apply window;
# dead bands suppress gate noise near equilibrium.
physical_mpc:
  log_base: 1.05
  ref_period: 0.02
  dead_ang: 0.001
  dead_pos: 0.001
  poll_stats_window_s: 5.0

mpc:
  optimizer: rpgd
  predictor_specification: "ODE"    # Can be "ODE", "ODE_v0", network/GP name (possibly with path) e.g. 'GRU-6IN-32H1-32H2-5OUT-0'/'SGP_30' or a name of a custom predictor. For more info see config_predictors in SI_Toolkit_ASF
  cost_function_specification: quadratic_boundary_grad_minimal  # One of "default", "quadratic_boundary_grad", "quadratic_boundary_nonconvex", "quadratic_boundary"
  computation_library: tensorflow  # One of "numpy", "tensorflow", "pytorch". Defaults to "numpy" if none given.
  controller_logging: false
  calculate_optimal_trajectory: false
  device: '/device:CPU:0'
mppi-cartpole:
  seed: null                            # Seed for rng, for MPPI only, put null to set random seed (do it when you generate data for training!)
  mpc_horizon: 35                       # steps
  num_rollouts: 3500                    # Number of Monte Carlo samples
  update_every: 1                       # Cost weighted update of inputs every ... steps
  predictor_specification: "ODE"    # Can be "ODE", "ODE_v0", network/GP name (possibly with path) e.g. 'GRU-6IN-32H1-32H2-5OUT-0'/'SGP_30' or a name of a custom predictor. For more info see config_predictors in SI_Toolkit_ASF
  cost_function_specification: default  # One of "default", "quadratic_boundary_grad", "quadratic_boundary_nonconvex", "quadratic_boundary"
  dd_weight: 120.0
  ep_weight: 50000.0
  ekp_weight: 0.01
  ekc_weight: 5.0
  cc_weight: 1.0
  ccrc_weight: 1.0
  cost_noise: 0.0                       # Noise on stage cost weights by +/- this value, we usually set 0.5 to explore various controllers while collecting data for training, 0 othewise
  control_noise:                        # Defined in cartpole config
  R: 1.0                                # How much to punish Q
  LBD: 100.0                            # Cost parameter lambda
  NU: 1000.0                            # Exploration variance
  SQRTRHOINV: 0.02                      # Sampling variance
  SAMPLING_TYPE: "interpolated"         # One of ["iid", "random_walk", "uniform", "repeated", "interpolated"]
  controller_logging: False                        # Collect and show detailed insights into the controller's behavior
  WASH_OUT_LEN: 100                     # Only matters if RNN used as predictor; For how long MPPI should be desactivated (replaced either with LQR or random input) to give memory units time to settle
custom-mpc-scipy:
  seed: null                          # If null, random seed based on datetime is used
  # method: 'L-BFGS-B'
  method: 'SLSQP'
  ftol: 1.0e-8
  mpc_horizon: 10                       # steps
  # weights
  wr: 0.001  # rterm
  l1: 100.0  # angle_cost
  l1_2: 0.0  # angle_sin_cost
  l2: 0.0  # angleD_cost
  l3: 0.0  # position_cost
  l4: 0.01  # positionD_cost
  m1: 0.0  # angle_sin_cost
  m2: 0.0  # angleD_cost
  m3: 0.0  # position_cost
  m4: 0.0  # positionD_cost
  controller_logging: True
do-mpc-discrete:
  mpc_horizon: 50                       # steps
  num_rollouts: 1
  # Initial positions
  position_init: 0.0
  positionD_init: 0.0
  angle_init: 0.0
  angleD_init: 0.0
  controller_logging: True
do-mpc:
  seed: null                          # If null, random seed based on datetime is used
  mpc_horizon: 50                       # steps
  num_rollouts: 1
  # Perturbation factors:
  # Change of output from optimal
  p_Q: 0.00
  # Random change of cost function by factor
  p_position: 0.0
  p_positionD: 0.0
  p_angle: 0.0
  # Cost factor
  l_angle: 0.1
  l_position: 1.0
  l_positionD: 0.1
  # Initial positions
  position_init: 0.0
  positionD_init: 0.0
  angle_init: 0.0
  angleD_init: 0.0
  controller_logging: True
lqr:
  seed: null  # Seed for rng, for lqr only, put null to set random seed (do it when you generate data for training!)
  # Q order: [position x, position velocity x_dot, pole angle theta, pole angular velocity theta_dot]
  Q: [10000.0, 1.0, 1.0, 1.0]
  R: 2000.0
  control_noise:  # Defined in cartpole config
  controller_logging: True
pid:
  computation_library: numpy
  P_angle: 18.0
  I_angle: 38.0
  D_angle: 4.0
  P_position: 22.0
  I_position: 1.0
  D_position: 12.0
  controller_logging: False
mpc-opti:
  mpc_horizon: 10                       # steps
  controller_logging: True
neural-imitator:
#  seed: null                            # If null, random seed based on datetime is used
#  PATH_TO_MODELS: './SI_Toolkit_ASF/Experiments/Experiment_16_11_2024_pole_L_and_m_informed/Models/'
#  net_name: 'GRU-8IN-64H1-64H2-1OUT-2'  # TF
# ACTIVE: exact 3 Jun 2025 committed experiment model (b9c6cfae).
# It was created 1 Jun with random vertical-angle shifts.
  PATH_TO_MODELS: './CartPoleSimulation/SI_Toolkit_ASF/Experiments/CP_Models_02_06_2025/Long/quant/'
  net_name: 'LSTM-7IN-64H1-64H2-1OUT-0'
# ALT: non-quant swing-label model selected later by 01c754b3:
#  PATH_TO_MODELS: './CartPoleSimulation/SI_Toolkit_ASF/Experiments/CP_Models_02_06_2025/Long/'
#  net_name: 'LSTM-7IN-64H1-64H2-1OUT-1'
# ALT: Dense-7IN-32H1-32H2-1OUT-8 (set nn_evaluator_mode: 'C', input_precision ap_fixed):
#  PATH_TO_MODELS: './CartPoleSimulation/SI_Toolkit_ASF/Experiments'
#  net_name: 'Dense-7IN-32H1-32H2-1OUT-8'
  input_at_input: False
  input_precision: 'float'  #'ap_fixed<20,6>'   # Can be 'float' - currently do nothing, or 'ap_fixed<total number of bits, integer bits + 1 sign bit>' - adjusting the number precision of the input
  clip_output: true  # June 2025 behavior: keep normalized motor command in [-1, 1]
  controller_logging: True
  nn_evaluator_mode: 'normal'  # 'normal', 'numpy', 'C' -- LSTM has no generated C next to the net
secloc:
  secloc_config: default  # gate profile (config_secloc.yml)
  controller_logging: false
secloc-lqr:
  # Legacy monolithic SecLoc gate + LQR (gate fused into the controller).
  # Twin of the on-chip Firmware/Src/General/secloc_lqr.c (SECLOC_LQR_Ops).
  seed: null
  # Q order: [position x, position velocity x_dot, pole angle theta, pole angular velocity theta_dot]
  Q: [2000.0, 1.0, 1.0, 1.0]  # Q0=R gives K0=-1, matching the gains baked into secloc_lqr.c
  R: 2000.0
  ref_period: 1     # gate checked every ref_period control ticks
  log_base: 1.05    # multiplicative event threshold on |shift| ratio
  dead_ang: 0.001   # dead bands suppress gate noise near equilibrium
  dead_pos: 0.001
  controller_logging: True
secloc-do-mpc-discrete:
  # Legacy monolithic SecLoc gate + do-mpc discrete (gate fused into the controller).
  # On events the MPC re-optimizes; between events the last control is replayed.
  mpc_horizon: 50   # steps
  ref_period: 4     # gate checked every ref_period control ticks; also scales the MPC prediction dt
  log_base: 1.05
  dead_ang: 0.001
  dead_pos: 0.001
  # Initial positions
  position_init: 0.0
  positionD_init: 0.0
  angle_init: 0.0
  angleD_init: 0.0
  controller_logging: True
secloc-c:
  # On-chip SecLoc gate + inner controller (LQR/PID/neural controller C),
  # compiled from the modular firmware sources and run on the PC via ctypes.
  controller_file: "secloc_controller.c"
  extra_sources: ["secloc_logic.c", "secloc_controller_pl.c", "lqr.c", "hardware_pid.c",
                  "neural_controller_C.c", "NC_C/network.c", "NC_C/network_parameters.c"]
  ops_name: "SECLOC_Ops"
  firmware_path: "../../Firmware/Src/General"
  controller_logging: True
embedded:
  seed: null                            # If null, random seed based on datetime is used
  controller_logging: True
  SERIAL_PORT: 1
  SERIAL_BAUD: 230400
remote:
  remote_endpoint: "tcp://localhost:5555"
  controller_logging: False
  fallback_controller_name: "neural-imitator"
difflg:
  controller_logging: False
  input_at_input: False
c:
  controller_file: "hardware_pid.c"  # Default to the same PID used by on-chip firmware control
  ops_name: "PID_Ops"                # Name of the ControllerOps structure in the C file
  firmware_path: "../Firmware/Src/General"
  controller_logging: True
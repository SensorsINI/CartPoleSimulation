controller: secloc-mpc
ML_Pipeline_mode: false
split:
- 0.8
- 0.1
PATH_TO_EXPERIMENT_RECORDINGS_DEFAULT: resultados/P1/MPC_SECLOC/
seed: 1
length_of_experiment: 30
random_initial_state:
  position: 0.0
  positionD: 0.0
  angle: 0.0
  angleD: 0.0
  target_position: 0.0
  init_limits:
    angle:
    - 0.0
    - 180.0
    angleD: 1200.0
    position: 0.8
    positionD: 0.5
start_at_target: true
track_fraction_usable_for_target_position: 0.8
target_position_end: null
initial_target_equilibrium: up
keep_target_equilibrium_x_seconds_up: inf
keep_target_equilibrium_x_seconds_down: inf
dt:
  simulation: 0.001
  control: 0.01
  saving: 0.01
turning_points:
  track_relative_complexity: 0.5
  interpolation_type: previous
  turning_points: null
  turning_points_period: regular
save_mode: online
show_summary_plots: false
show_controller_report: false
number_of_experiments: 1
